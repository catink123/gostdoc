[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gostdoc"
version = "0.1.0"
description = "Markdown -> GOST-formatted .docx (ЕСКД пояснительная записка, ГОСТ 7.32 отчёт)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["gost", "eskd", "docx", "markdown", "word", "гост", "ескд", "пояснительная записка", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Russian",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "python-docx>=1.1",
    "lxml",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "PyYAML",
    "Pillow",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pymupdf"]

[project.urls]
Repository = "https://github.com/catink123/gostdoc"

[project.scripts]
gostdoc = "gostdoc.cli:main"

[tool.setuptools]
packages = ["gostdoc"]

[tool.setuptools.package-data]
gostdoc = ["AI_INSTRUCTIONS.md"]
